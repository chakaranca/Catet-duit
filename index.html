<title>Catat Duit</title>
<style>
:root{--bg:#eef1f5;--sf:#fff;--tx:#101828;--mu:#667085;--ln:#e1e5ec;--ac:#2f5bea;--oa:#fff;--in:#12805c;--out:#d92d20;--hero:#101828;--ht:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1018;--sf:#151b26;--tx:#eef2f8;--mu:#97a0b3;--ln:#252d3b;--ac:#7aa2ff;--oa:#0c1018;--in:#4cc9a0;--out:#ff7a6e;--hero:#1d2636;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1018;--sf:#151b26;--tx:#eef2f8;--mu:#97a0b3;--ln:#252d3b;--ac:#7aa2ff;--oa:#0c1018;--in:#4cc9a0;--out:#ff7a6e;--hero:#1d2636;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
h1{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--mu)}
.hero{background:var(--hero);color:var(--ht);border-radius:22px;padding:22px 20px;margin-bottom:18px}
.hero small{opacity:.7;font-size:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0 8px}
.hero p{margin:0;font-size:14px;opacity:.9}
.hero .neg{color:#ffb4a8}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.amt-in{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ln);padding:4px 0 6px;margin-bottom:10px}
.amt-in span{font-size:22px;font-weight:600;color:var(--mu)}
.amt-in input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:700;outline:0;padding:0}
.amt-in:focus-within{border-color:var(--ac)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 13px;font-size:14px}
.chip.on{background:var(--ac);color:var(--oa);border-color:var(--ac);font-weight:600}
.chip.q{color:var(--mu)}
label.f{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.inp{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px;font-size:16px;margin-bottom:14px;outline:0}
.inp:focus{border-color:var(--ac)}
.go{width:100%;border:0;background:var(--ac);color:var(--oa);font-weight:700;font-size:17px;padding:15px;border-radius:14px}
.go:active{transform:scale(.98)}
.lbl{font-size:15px;font-weight:600;margin:24px 0 4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.ic{font-size:22px;width:34px;text-align:center}
.m{flex:1;min-width:0}
.m b{display:block;font-weight:600}
.m small{color:var(--mu);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:6px;padding:0 6px;font-size:11px;margin-right:6px;color:var(--mu)}
.amt{font-weight:600;white-space:nowrap}
.amt.out{color:var(--out)}.amt.in{color:var(--in)}
.x{border:0;background:none;color:var(--mu);font-size:15px;padding:6px}
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);padding:18px 0 4px;font-weight:600}
.empty{color:var(--mu);text-align:center;padding:26px 0;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:17px}
.mnav button{border:0;background:var(--sf);width:40px;height:40px;border-radius:12px;font-size:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin-bottom:6px}
.stats div{padding:14px 0}
.stats div:nth-child(odd){padding-right:14px;border-right:1px solid var(--ln)}
.stats div:nth-child(even){padding-left:16px}
.stats small{display:block;color:var(--mu);font-size:13px}
.stats b{font-size:20px}
.in{color:var(--in)}.out{color:var(--out)}
.bl{display:flex;justify-content:space-between;font-size:14px;margin:16px 0 6px;gap:8px}
.bl span:last-child{color:var(--mu)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar i.over{background:var(--out)}
.bar i.good{background:var(--in)}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
textarea.inp{min-height:90px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btns button{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 14px;font-weight:600}
.btns .danger{color:var(--out)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px;color:var(--mu);font-size:12px;font-weight:600}
nav button span{display:block;font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ac)}
nav button.on span{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
<section id="v-in">
  <div class="hero" id="hero"></div>
  <div class="seg"><button data-t="out" class="on">Pengeluaran</button><button data-t="in">Pemasukan</button></div>
  <div class="amt-in"><span>Rp</span><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0"></div>
  <div class="row2"><button class="chip q" data-q="5000">+5rb</button><button class="chip q" data-q="10000">+10rb</button><button class="chip q" data-q="20000">+20rb</button><button class="chip q" data-q="50000">+50rb</button><button class="chip q" data-q="100000">+100rb</button></div>
  <label class="f">Kategori</label><div class="row2" id="cats"></div>
  <label class="f">Bayar pakai</label><div class="row2" id="meths"></div>
  <label class="f" for="note">Catatan (opsional)</label>
  <input class="inp" id="note" placeholder="Contoh: nasi padang sama es teh" autocomplete="off">
  <label class="f" for="date">Tanggal</label>
  <input class="inp" id="date" type="date">
  <button class="go" data-add>Simpan catatan</button>
  <div class="lbl">Catatan hari ini</div>
  <div id="today"></div>
</section>

<section id="v-hist" hidden>
  <h1>Riwayat</h1>
  <div id="hmn"></div>
  <div class="row2" id="flt"></div>
  <div id="hlist"></div>
</section>

<section id="v-sum" hidden>
  <h1>Ringkasan</h1>
  <div id="sumdyn"></div>
  <div class="lbl">Atur target</div>
  <label class="f" for="bud">Budget pengeluaran per bulan (Rp)</label>
  <input class="inp" id="bud" inputmode="numeric" placeholder="Contoh: 3.000.000">
  <label class="f" for="tgt">Target nabung per bulan (Rp)</label>
  <input class="inp" id="tgt" inputmode="numeric" placeholder="Contoh: 1.000.000">
  <button class="go" data-saveset>Simpan target</button>
  <div class="lbl">Backup data</div>
  <p class="note" style="margin:0 0 10px">Data tersimpan di HP ini. Rutin salin backup biar aman kalau data Safari kehapus.</p>
  <div class="btns"><button data-bk>Buat &amp; salin backup</button><button data-rs>Pulihkan dari teks</button><button class="danger" data-wipe>Hapus semua</button></div>
  <textarea class="inp" id="bkt" placeholder="Teks backup muncul di sini. Untuk pulihkan, tempel teks backup lalu tekan Pulihkan."></textarea>
  <p class="note">Pasang di home screen: buka di Safari, tekan tombol Share, pilih Add to Home Screen.</p>
</section>
</main>
<nav>
  <button data-tab="in" class="on"><span>✏️</span>Catat</button>
  <button data-tab="hist"><span>🗂️</span>Riwayat</button>
  <button data-tab="sum"><span>📊</span>Ringkasan</button>
</nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='catatduit_v1';
let S={tx:[],budget:0,target:0};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.tx))S=Object.assign(S,p)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Gagal menyimpan. Cek mode private Safari.');return false}}
const EXP=[['🍜','Makan'],['☕','Jajan & kopi'],['🛵','Transport'],['🛒','Belanja'],['🧾','Tagihan'],['👥','Nongkrong'],['🎮','Hiburan'],['💊','Kesehatan'],['📚','Pendidikan'],['📦','Lainnya']];
const INC=[['💼','Gaji'],['💻','Freelance'],['🎁','Uang saku'],['📈','Investasi'],['📦','Lainnya']];
const METH=['Cash','E-wallet','QRIS','Debit','Transfer'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const rp=n=>(n<0?'−':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const num=v=>Number(String(v).replace(/\D/g,''))||0;
const fmt=n=>n?Number(n).toLocaleString('id-ID'):'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const icon=(t,c)=>{const f=(t==='out'?EXP:INC).find(x=>x[1]===c);return f?f[0]:'📦'};
const dl=d=>{const [y,m,x]=d.split('-').map(Number);return new Date(y,m-1,x).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})};
let type='out',cat='Makan',meth='Cash',ym=iso(new Date()).slice(0,7),flt='all',tab='in';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}

function chips(){
  const L=type==='out'?EXP:INC;
  $('#cats').innerHTML=L.map(([i,n])=>`<button class="chip ${n===cat?'on':''}" data-c="${esc(n)}">${i} ${esc(n)}</button>`).join('');
  $('#meths').innerHTML=METH.map(m=>`<button class="chip ${m===meth?'on':''}" data-m="${m}">${m}</button>`).join('');
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===type));
}
function row(t){
  return `<div class="row"><span class="ic">${icon(t.type,t.cat)}</span><div class="m"><b>${esc(t.cat)}</b><small>${t.note?esc(t.note):''}</small><small><span class="tag">${esc(t.meth||'Cash')}</span></small></div><span class="amt ${t.type}">${t.type==='out'?'−':'+'}${rp(t.amt).replace('−','')}</span><button class="x" data-del="${t.id}" aria-label="Hapus">✕</button></div>`;
}
function home(){
  const n=new Date(),t=iso(n),cm=t.slice(0,7),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  const m=S.tx.filter(x=>x.date.startsWith(cm)),out=sum(m,'out'),td=S.tx.filter(x=>x.date===t);
  let h='';
  if(S.budget){
    const left=S.budget-out,dl2=dim-n.getDate()+1;
    h=`<small>Jatah belanja per hari, sisa bulan ini</small><div class="big">${left>0?rp(left/dl2):'Rp0'}</div><p>${left>=0?'Hari ini keluar '+rp(sum(td,'out'))+' dari budget sisa '+rp(left):'<span class="neg">Budget bulan ini lewat '+rp(-left)+'</span>'}</p>`;
  }else{
    h=`<small>Keluar hari ini</small><div class="big">${rp(sum(td,'out'))}</div><p>Isi budget bulanan di tab Ringkasan biar muncul jatah harian.</p>`;
  }
  $('#hero').innerHTML=h;
  $('#today').innerHTML=td.length?td.slice().sort((a,b)=>b.id-a.id).map(row).join(''):'<p class="empty">Belum ada catatan. Catat pengeluaran pertama lo di atas.</p>';
}
function mnav(){
  const [y,m]=ym.split('-').map(Number);
  return `<div class="mnav"><button data-mv="-1" aria-label="Bulan sebelumnya">‹</button><b>${new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button data-mv="1" aria-label="Bulan berikutnya">›</button></div>`;
}
function hist(){
  $('#hmn').innerHTML=mnav();
  $('#flt').innerHTML=[['all','Semua'],['out','Keluar'],['in','Masuk']].map(([k,l])=>`<button class="chip ${flt===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  const m=S.tx.filter(x=>x.date.startsWith(ym)&&(flt==='all'||x.type===flt));
  const g={};m.forEach(x=>(g[x.date]=g[x.date]||[]).push(x));
  const ds=Object.keys(g).sort().reverse();
  $('#hlist').innerHTML=ds.length?ds.map(d=>{const o=sum(g[d],'out');return `<div class="dh"><span>${dl(d)}</span><span>${o?'Keluar '+rp(o):''}</span></div>`+g[d].sort((a,b)=>b.id-a.id).map(row).join('')}).join(''):'<p class="empty">Nggak ada catatan di bulan ini.</p>';
}
function bar(label,val,max,bad){
  const p=Math.min(100,val/max*100),over=bad&&val>max,good=!bad&&val>=max;
  return `<div class="bl"><span>${label}</span><span>${rp(val)} dari ${rp(max)}</span></div><div class="bar"><i class="${over?'over':good?'good':''}" style="width:${p}%"></i></div>`;
}
function brk(arr,key,total){
  const g={};arr.forEach(x=>g[x[key]||'Cash']=(g[x[key]||'Cash']||0)+x.amt);
  return Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bl"><span>${key==='cat'?icon('out',k)+' ':''}${esc(k)}</span><span>${rp(v)} (${Math.round(v/total*100)}%)</span></div><div class="bar"><i style="width:${v/total*100}%"></i></div>`).join('');
}
function sumv(){
  const m=S.tx.filter(x=>x.date.startsWith(ym)),outs=m.filter(x=>x.type==='out'),out=sum(m,'out'),inc=sum(m,'in'),net=inc-out;
  const [y,mo]=ym.split('-').map(Number),now=new Date(),cur=ym===iso(now).slice(0,7);
  const el=cur?now.getDate():new Date(y,mo,0).getDate();
  const days=new Set(outs.map(x=>x.date)).size;
  let h=mnav()+`<div class="stats"><div><small>Pemasukan</small><b class="in">${rp(inc)}</b></div><div><small>Pengeluaran</small><b class="out">${rp(out)}</b></div><div><small>Sisa bulan ini</small><b class="${net<0?'out':'in'}">${rp(net)}</b></div><div><small>Porsi yang ditabung</small><b>${inc?Math.round(net/inc*100)+'%':'-'}</b></div><div><small>Rata-rata keluar per hari</small><b>${rp(out/el)}</b></div><div><small>Hari tanpa jajan</small><b>${Math.max(0,el-days)} hari</b></div></div>`;
  if(S.budget)h+=bar('Budget bulanan',out,S.budget,true);
  if(S.target)h+=bar('Target nabung',Math.max(net,0),S.target,false);
  if(out){
    h+=`<div class="lbl">Uang keluar ke mana</div>`+brk(outs,'cat',out);
    h+=`<div class="lbl">Bayar pakai apa</div>`+brk(outs,'meth',out);
  }else h+='<p class="empty">Belum ada pengeluaran di bulan ini.</p>';
  $('#sumdyn').innerHTML=h;
}
function render(){
  if(tab==='in')home();else if(tab==='hist')hist();else sumv();
}
function show(v){
  tab=v;['in','hist','sum'].forEach(k=>$('#v-'+k).hidden=k!==v);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===v));
  if(v==='sum'){$('#bud').value=fmt(S.budget);$('#tgt').value=fmt(S.target)}
  render();window.scrollTo(0,0);
}
document.addEventListener('input',e=>{if(['amt','bud','tgt'].includes(e.target.id))e.target.value=fmt(num(e.target.value))});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab)show(d.tab);
  else if(d.t){type=d.t;cat=(type==='out'?EXP:INC)[0][1];chips()}
  else if(d.c){cat=d.c;chips()}
  else if(d.m){meth=d.m;chips()}
  else if(d.q){$('#amt').value=fmt(num($('#amt').value)+Number(d.q))}
  else if(d.f){flt=d.f;hist()}
  else if(d.mv){const [y,m]=ym.split('-').map(Number),n=new Date(y,m-1+Number(d.mv),1);ym=n.getFullYear()+'-'+pad(n.getMonth()+1);render()}
  else if(d.del){if(confirm('Hapus catatan ini?')){S.tx=S.tx.filter(x=>String(x.id)!==d.del);save();render()}}
  else if(b.hasAttribute('data-add')){
    const a=num($('#amt').value);
    if(!a){toast('Isi nominalnya dulu');$('#amt').focus();return}
    S.tx.push({id:Date.now(),type,amt:a,cat,meth,note:$('#note').value.trim(),date:$('#date').value||iso(new Date())});
    if(save()){$('#amt').value='';$('#note').value='';toast(type==='out'?'Pengeluaran disimpan':'Pemasukan disimpan');render()}
  }
  else if(b.hasAttribute('data-saveset')){S.budget=num($('#bud').value);S.target=num($('#tgt').value);save();toast('Target disimpan');render()}
  else if(b.hasAttribute('data-bk')){
    const t=JSON.stringify(S);$('#bkt').value=t;$('#bkt').select();
    try{navigator.clipboard.writeText(t).then(()=>toast('Backup disalin'),()=>toast('Tekan lama teks lalu Copy'))}catch(x){toast('Tekan lama teks lalu Copy')}
  }
  else if(b.hasAttribute('data-rs')){
    try{const p=JSON.parse($('#bkt').value);if(!p||!Array.isArray(p.tx))throw 0;
      if(confirm('Ganti semua data sekarang dengan backup ini?')){S={tx:p.tx,budget:p.budget||0,target:p.target||0};save();toast('Data dipulihkan');show('sum')}
    }catch(x){toast('Teks backup nggak valid')}
  }
  else if(b.hasAttribute('data-wipe')){if(confirm('Hapus SEMUA catatan? Ini nggak bisa dibatalin.')){S={tx:[],budget:0,target:0};save();toast('Semua data dihapus');show('sum')}}
});
$('#date').value=iso(new Date());
chips();render();
</script>
</body>
</html>
